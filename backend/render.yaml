services:
  - type: web
    name: civicserve-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: CORS_ORIGIN
        value: "*"
